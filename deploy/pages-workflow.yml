name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Belt and braces: the shell must never carry copyrighted material.
      - name: Refuse to publish private data
        run: |
          set -e
          bad=$(find app -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -path 'app/data/week*' -o -path 'app/data/build*' -o -iname 'grammar-notes-*' -o -iname 'highlights-*' \) || true)
          if [ -n "$bad" ]; then echo "Private files found under app/:"; echo "$bad"; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
